#@TYPE: Machine
#@NAME: hello-world-zcu102-zynqmp
#@DESCRIPTION: Machine to support a hello world PL layer on ZCU102 hardware

# Xilinx documentation on machine layers: https://github.com/Xilinx/meta-xilinx/blob/rel-v2024.2/meta-xilinx-core/conf/machine/README

#### Preamble
MACHINEOVERRIDES =. "${@['', 'hello-world-zcu102-zynqmp:']['hello-world-zcu102-zynqmp' != '${MACHINE}']}"
#### Regular settings follow

require conf/machine/zynqmp-generic.conf

HDF_URI = "file://hello-world-zcu102-zynqmp.xsa"
XILINX_WITH_ESW = "xsct"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' hello-world-zcu102-zynqmp']['hello-world-zcu102-zynqmp' != "${MACHINE}"]}"