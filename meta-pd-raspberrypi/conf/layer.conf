# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_pd-raspberrypi = "scarthgap"

BBFILE_COLLECTIONS += "pd-raspberrypi"
BBFILE_PATTERN_pd-raspberrypi = "^${LAYERDIR}/"
BBFILE_PRIORITY_pd-raspberrypi = "84"

LAYERDEPENDS_pd-raspberrypi = "mender "

# Recommended for u-boot support for raspberrypi5
# https://git.yoctoproject.org/meta-lts-mixins 'scarthgap/u-boot' branch
LAYERRECOMMENDS_pd-raspberrypi = "lts-u-boot-mixin"